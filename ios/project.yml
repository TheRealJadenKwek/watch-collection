name: WatchCollection
options:
  bundleIdPrefix: com.jadenkwek
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
targets:
  WatchCollection:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: WatchCollection.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jadenkwek.watchcollection]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadenkwek.watchcollection
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WC_CLOUDKIT
        DEVELOPMENT_TEAM: RLC58VS9R6
        MARKETING_VERSION: "5.1"
        CURRENT_PROJECT_VERSION: "13"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets:
        - WatchCollectionTests
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Watch Collection
        BGTaskSchedulerPermittedIdentifiers:
          - com.jadenkwek.watchcollection.refresh
        UIBackgroundModes:
          - fetch
        NSLocalNetworkUsageDescription: Sync your watch collection and photos with your Mac.
        UILaunchScreen: {}
        # Only a folding iPhone's inner screen turns: WatchAppDelegate keeps every other iPhone upright.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jadenkwek.watchcollection.backup
            UTTypeDescription: Watch Collection Backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - watchcollection
              public.mime-type:
                - application/x-watchcollection
        CFBundleDocumentTypes:
          - CFBundleTypeName: Watch Collection Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.jadenkwek.watchcollection.backup
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: Add photos to your watch collection.
        NSCameraUsageDescription: Take photos for your watch collection.
  WatchCollectionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: WatchCollection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadenkwek.watchcollection.tests
        DEVELOPMENT_TEAM: RLC58VS9R6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
  WatchCollectionMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - WatchCollectionApp.swift
      - path: Mac
    entitlements:
      path: Mac/WatchCollectionMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jadenkwek.watchcollection]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: $(WC_CLOUDKIT_ENV)
    settings:
      configs:
        Debug:
          WC_CLOUDKIT_ENV: Development
        Release:
          WC_CLOUDKIT_ENV: Production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadenkwek.watchcollection.mac
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WC_CLOUDKIT
        PRODUCT_NAME: Watch Collection
        DEVELOPMENT_TEAM: RLC58VS9R6
        MARKETING_VERSION: "5.1"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Watch Collection
        LSApplicationCategoryType: public.app-category.lifestyle
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.jadenkwek.watchcollection.backup
            UTTypeDescription: Watch Collection Backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - watchcollection
