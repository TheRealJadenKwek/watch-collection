name: WatchCollection
options:
  bundleIdPrefix: com.jadenkwek
  deploymentTarget:
    iOS: "18.0"
targets:
  WatchCollection:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jadenkwek.watchcollection
        DEVELOPMENT_TEAM: RLC58VS9R6
        MARKETING_VERSION: "3.1"
        CURRENT_PROJECT_VERSION: "12"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Watch Collection
        BGTaskSchedulerPermittedIdentifiers:
          - com.jadenkwek.watchcollection.refresh
        UIBackgroundModes:
          - fetch
        NSLocalNetworkUsageDescription: Sync your watch collection and photos with your Mac.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jadenkwek.watchcollection.backup
            UTTypeDescription: Watch Collection Backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - watchcollection
              public.mime-type:
                - application/x-watchcollection
        CFBundleDocumentTypes:
          - CFBundleTypeName: Watch Collection Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.jadenkwek.watchcollection.backup
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: Add photos to your watch collection.
        NSCameraUsageDescription: Take photos for your watch collection.
